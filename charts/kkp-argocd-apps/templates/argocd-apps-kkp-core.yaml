---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubermatic-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: ArgoCD Project for all core KKP configurations
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
  destinations:
  - namespace: kubermatic
    server: https://kubernetes.default.svc
  - namespace: mla
    server: https://kubernetes.default.svc
  - namespace: iap
    server: https://kubernetes.default.svc
  - namespace: argocd
    server: https://kubernetes.default.svc

{{ if .Values.dex.enable }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: '{{ .Values.kkpRepoURL }}'
    path: {{ template "kkp.chart.pathprefix" . }}/charts/dex
    targetRevision: {{ .Values.kkpVersion }}
    helm:
      valueFiles:
        - values.yaml
        - $values/{{ template "argo-cd-apps.env-specific-values-file.path" . }}
        - $values/{{ template "argo-cd-apps.seed-override-values-file.path" . }}
  # This is your private repo where you have stored the values.yaml customizations which you used to provide to KKP installer. 
  - repoURL: '{{ .Values.repoURL }}'
    targetRevision: {{ template "git-tag-version" . }}
    path: {{ .Values.valuesPathPrefix }}
    ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dex
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  {{- if .Values.dex.autoSync }}
    automated: {}
  {{ end }}
{{ end }}

{{ if .Values.nginx.enable }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Deploys first
spec:
  project: default
  sources:
  - repoURL: '{{ .Values.kkpRepoURL }}'
    path: {{ template "kkp.chart.pathprefix" . }}/charts/nginx-ingress-controller
    targetRevision: {{ .Values.kkpVersion }}
    helm:
      valueFiles:
        - values.yaml
        - $values/{{ template "argo-cd-apps.env-specific-values-file.path" . }}
        - $values/{{ template "argo-cd-apps.seed-override-values-file.path" . }}
  # This is your private repo where you have stored the values.yaml customizations which you used to provide to KKP installer. 
  - repoURL: '{{ .Values.repoURL }}'
    targetRevision: {{ template "git-tag-version" . }}
    path: {{ .Values.valuesPathPrefix }}
    ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nginx-ingress-controller
  # nginx ingress app to be synced automatically so that we can access ArgoCD via it!
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Retry=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  {{- if .Values.nginx.autoSync }}
    automated: {}
  {{ end }}
{{ end }}


{{ if .Values.certManager.enable }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
      argocd.argoproj.io/sync-wave: "-1" # Deploys first
spec:
  project: default
  sources:
  - repoURL: '{{ .Values.kkpRepoURL }}'
    path: {{ template "kkp.chart.pathprefix" . }}/charts/cert-manager
    targetRevision: {{ .Values.kkpVersion }}
    helm:
      parameters:
      - name: "cert-manager.installCRDs"
        value: "true"
      valueFiles:
        - values.yaml
        - $values/{{ template "argo-cd-apps.env-specific-values-file.path" . }}
        - $values/{{ template "argo-cd-apps.seed-override-values-file.path" . }}
  # This is your private repo where you have stored the values.yaml customizations which you used to provide to KKP installer. 
  - repoURL: '{{ .Values.repoURL }}'
    targetRevision: {{ template "git-tag-version" . }}
    path: {{ .Values.valuesPathPrefix }}
    ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  {{- if .Values.certManager.autoSync }}
  # cert-manager app to be synced automatically so that we get certificates issued for KKP dashboard and ArgoCD to start with
    automated: {}
  {{ end }}
{{ end }}
---
{{ if .Values.envoyGatewayController.enable }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-controller
  namespace: argocd
spec:
  project: default
  source:
  - repoURL: '{{ .Values.kkpRepoURL }}'
    path: {{ template "kkp.chart.pathprefix" . }}/charts/envoy-gateway-controller
    targetRevision: {{ .Values.kkpVersion }}
    helm:
      valueFiles:
        - values.yaml
        - $values/{{ template "argo-cd-apps.env-specific-values-file.path" . }}
        - $values/{{ template "argo-cd-apps.seed-override-values-file.path" . }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: envoy-gateway-controller
  syncPolicy:
  {{- if .Values.envoyGatewayController.autoSync }}
    automated: {}
  {{ end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# FIXME: this is not working well because there is no Gateway CRD installed before hand.
# What I have done in non-argocd setup is to install the Gateway CRD first and then create the Gateway resource.
# Currently the argodemo is updated to install the Gateway CRD first and then create the Gateway resource.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.envoyGatewayController.gateway.clusterIssuer }}
  labels:
    app.kubernetes.io/name: kubermatic
  name: kubermatic
  namespace: {{ .Values.envoyGatewayController.gateway.namespace }}
spec:
  gatewayClassName: {{ .Values.envoyGatewayController.gateway.gatewayClassName }}
  listeners:
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubermatic.io/gateway-access: "true"
    name: http
    port: 80
    protocol: HTTP
  {{- range .Values.envoyGatewayController.gateway.routes }}
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubermatic.io/gateway-access: "true"
    hostname: {{ .hostname }}
    name: {{ .secretName }}
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: {{ .secretName }}
      mode: Terminate
  {{- end }}
{{- if .Values.envoyGatewayController.gateway.routes }}
---
# TLS certificates backing the Gateway listeners above, generated from the same
# .Values.gateway.routes list so each hostname/secretName pair is only defined once.
apiVersion: v1
kind: List
metadata: {}
items:
{{- range $.Values.envoyGatewayController.gateway.routes }}
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: {{ .secretName }}
    namespace: {{ $.Values.envoyGatewayController.gateway.namespace }}
  spec:
    dnsNames:
    - {{ .hostname }}
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: {{ $.Values.envoyGatewayController.gateway.clusterIssuer }}
    secretName: {{ .secretName }}
    usages:
    - digital signature
    - key encipherment
{{- end }}
{{- end }}

{{- if .Values.envoyGatewayController.gateway.accessNamespaces }}
---
# Namespaces that host HTTPRoutes attached to the Gateway above need this label for its
# allowedRoutes namespace selector to match them (see .Values.gateway.accessNamespaces).
apiVersion: v1
kind: List
metadata: {}
items:
{{- range .Values.envoyGatewayController.gateway.accessNamespaces }}
- apiVersion: v1
  kind: Namespace
  metadata:
    name: {{ . }}
    labels:
      kubermatic.io/gateway-access: "true"
{{- end }}
{{- end }}

---
{{ end }}


{{ if .Values.metricsServer.enable }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  # Upstream chart directly, NOT one of the kubermatic/kubermatic charts --
  # metrics-server isn't shipped by KKP itself. On real kubeone-based envs it
  # comes for free as a kubeone default addon; kind-based seeds have no
  # kubeone in the loop, so it's managed here instead.
  sources:
  - repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: {{ .Values.metricsServer.chartVersion }}
    helm:
      values: |
        # kind's kubelet serving certs aren't valid for the kubelet's
        # in-cluster IP/hostname, so metrics-server's TLS verification of the
        # kubelet API needs to be relaxed.
        args:
          - --kubelet-insecure-tls
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  {{- if .Values.metricsServer.autoSync }}
    automated: {}
  {{ end }}
{{ end }}

{{ if and .Values.seedSettings.enable .Values.isMasterSeed }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: master-settings-{{ .Values.seed }}
  namespace: argocd
spec:
  project: kubermatic-config
  sources:
  - repoURL: '{{ .Values.repoURL }}'
    targetRevision: {{ template "git-tag-version" . }}
    path: {{ template "argo-cd-apps.env-specific-kkp-settings.path" . }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kubermatic
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  {{- if .Values.seedSettings.autoSync }}
    automated: {}
  {{ end }}
{{ end }}

{{ if .Values.seedExtras.enable }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seed-extras-{{ .Values.seed }}
  namespace: argocd
spec:
  project: kubermatic-config
  sources:
  - repoURL: '{{ .Values.repoURL }}'
    targetRevision: {{ template "git-tag-version" . }}
    path: '{{ .Values.environment }}'
    directory:
      recurse: true
      exclude: '{**/values.yaml,**/{{ .Values.userMlaValuesFileName }},**/k8cConfig.yaml}'
      include: '{common/*,{{ .Values.seed }}/*}'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kubermatic
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # sometimes things take time and hence we should control the retry params
    retry:
      limit: 100
      backoff:
        duration: "20s"
        factor: 1
        maxDuration: "3m0s"
  {{- if .Values.seedExtras.autoSync }}
    # selfHeal (unlike the other Applications in this chart) because
    # UserProjectBinding carries an ownerReference to its Project that KKP's
    # controller adds post-creation -- if a Project ever gets reconciled with
    # even a momentary UID change, Kubernetes' garbage collector cascade-
    # deletes any binding whose owner reference no longer resolves. Without
    # selfHeal, plain `automated: {}` only reacts to git changes, not to a
    # resource disappearing from the live cluster, so the deleted binding
    # just sits OutOfSync until someone clicks Sync manually.
    automated:
      selfHeal: true
  {{ end }}
{{ end }}