# customize as per environment

# e.g. test / sandbox / dev / prod
environment: notSet
# your seed-identifier e.g. eu-central-1 / ireland / china / chicago / etc
seed: notSet

# set to true if you are installing on a master or master-seed combo
isMasterSeed: false

# As per the version being installed. You must specify this version as param to helm chart
kkpVersion: notSet
kkpRepoURL: https://github.com/kubermatic/kubermatic.git  # Repo where we can find all KKP helm charts
kkpChartsInCustomRepo: false # Toggle this to `true` if you want to use custom repo for storing kkp charts and then adjust the kkpBasePath to match the path
kkpBasePath: null

# Repo where your environment specific KKP customizations are available. Typically, we have seen environment specific, seed specific override files stored in this repo.
repoURL: notSet 
envSpecificValuesFileName: values.yaml
seedOverrideValuesFileName: values.yaml
envSpecificSettingFolderName: settings
userMlaValuesFileName: values-usermla.yaml

# KKP Core
dex:
  enable: false
  autoSync: false
# TODO: In future, remove nginx app completely as we move to envoy-gateway-controller instead.
nginx:
  enable: false
  autoSync: true
envoyGatewayController:
  enable: false
  autoSync: true
  # Gateway API "kubermatic" Gateway (see envoyGatewayController) plus the cert-manager
  # Certificates backing its TLS listeners. Both are generated from `gateway.routes` below -
  # populate that list per-environment in the environment's values-argocd-apps.yaml since
  # hostname patterns differ across environments/seeds and can't be derived generically here.
  gateway:
    namespace: kubermatic
    gatewayClassName: kubermatic-envoy-gateway
    # clusterIssuer: ca-prod
    # - hostname: <full FQDN>
    #   secretName: <TLS secret name; also reused as the Gateway listener name and Certificate name>
    routes: []
    # Namespaces that HTTPRoutes live in need `kubermatic.io/gateway-access: "true"` for the
    # Gateway's allowedRoutes namespace selector to pick them up. List them here (per-environment,
    # since the set of namespaces/apps deployed differs) instead of labelling them by hand.
    accessNamespaces: []

certManager:
  enable: false
  autoSync: true
# Not one of KKP's own charts -- pulled straight from the upstream
# kubernetes-sigs Helm repo. Only relevant for seeds without a kubeone addon
# equivalent (e.g. kind-based local seeds).
metricsServer:
  enable: false
  autoSync: false
  chartVersion: 3.12.2
seedSettings:
  enable: false
  autoSync: false
# If you have any env specific and/or seed specific random yaml files to apply
# e.g. preset, metering secret, kubeconfig secret in case of master seed, etc
seedExtras:
  enable: false
  autoSync: false

#backup
velero:
  enable: false
  autoSync: false

#monitoring
prometheus:
  enable: false
  autoSync: false
alertManager:
  enable: false
  autoSync: false
grafana:
  enable: false
  autoSync: false
kubeStateMetrics:
  enable: false
  autoSync: false
nodeExporter:
  enable: false
  autoSync: false
blackboxExporter:
  enable: false
  autoSync: false
# TODO: Install thanos from upstream (bitnami / banzai / stevehipwell) directly
thanos:
  enable: false
  autoSync: false
iapSeedMla:
  enable: false
  autoSync: false

#logging
alloy:
  enable: false
  autoSync: false
loki:
  enable: false
  autoSync: false

# apps to install - by default everything is NOT deployed
# minio chart is available with kkp OOTB.
minio:
  enable: false
  autoSync: false

# TODO: Get these apps setup too
# Recommended: if you want more elaborated setup and not have single point of failure 
# for all kinds of storages e.g. seed as well as user-cluster etcd backup storages, 
# prometheus, thanos, grafana etc
# minioOperator: false

#user cluster mla
userMla:
  enable: false # master switch to control whether you want to deploy user-cluster MLA or not
  minio:
    enable: false
    autoSync: false
  minioLifecycleMgr:
    enable: false
    autoSync: false
  grafana:
    enable: false
    autoSync: false
  consul:
    enable: false
    autoSync: false
  cortex:
    enable: false
    autoSync: false
  lokiDistributed:
    enable: false
    autoSync: false
  alertmanagerProxy:
    enable: false
    autoSync: false
  iapMla:
    enable: false
    autoSync: false
  secrets:
    enable: false
    autoSync: false
